<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FormForge">
  <meta name="description" content="FormForge local-first fitness operating system">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=180">
  <title>FORMFORGE — Fitness OS</title>
  <link rel="stylesheet" href="/v17.css?v=180">
  <link rel="stylesheet" href="/v18.css?v=180">
</head>
<body>
  <noscript><main class="auth-shell"><section class="auth-card"><h1>JavaScript is required</h1><p>FormForge needs JavaScript enabled to load its local interface.</p></section></main></noscript>
  <div id="toast" aria-live="polite"></div>
  <div id="auth-shell" class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">FF</div>
      <p class="eyebrow">FITNESS OPERATING SYSTEM</p>
      <h1 id="auth-title">FORMFORGE</h1>
      <p id="auth-copy" class="muted">Secure local fitness tracking for you and approved users.</p>
      <form id="auth-form" class="stack"></form>
      <button id="recovery-toggle" class="link-button" type="button">Administrator recovery</button>
      <div id="recovery-panel" class="hidden"></div>
    </section>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span>FF</span><div><strong>FORMFORGE</strong><small>Fitness OS</small></div></div>
      <nav id="desktop-nav"></nav>
      <div class="sidebar-foot"><span id="user-chip"></span><button id="logout-btn" class="ghost-btn">Sign out</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><p class="eyebrow" id="page-kicker">OVERVIEW</p><h1 id="page-title">Dashboard</h1></div><div class="top-actions"><button id="install-btn" class="outline-btn hidden">Install app</button><button id="refresh-btn" class="icon-button" title="Refresh">↻</button></div></header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
    <nav id="mobile-nav" class="mobile-nav"></nav>
  </div>

  <dialog id="modal"><form method="dialog" class="modal-card"><div class="modal-head"><div><p class="eyebrow" id="modal-kicker"></p><h2 id="modal-title"></h2></div><button class="icon-button" value="cancel">×</button></div><div id="modal-body"></div></form></dialog>
  <script src="/v14.js?v=180" defer></script>
  <script src="/coaching-ui.js?v=180" defer></script>
  <script src="/app.js?v=180" defer></script>
  <script src="/v15.js?v=180" defer></script>
  <script src="/v16.js?v=180" defer></script>
  <script src="/v17.js?v=180" defer></script>
  <script src="/v18.js?v=180" defer></script>
</body>
</html>
