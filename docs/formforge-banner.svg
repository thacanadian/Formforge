<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">FormForge — Personal Fitness OS</title>
  <desc id="desc">A dark editorial banner showing FormForge fitness metrics.</desc>
  <defs>
