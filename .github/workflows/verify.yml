name: Verify FormForge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: go build -trimpath -o bin/formforge .
      - name: Check browser JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Compile runtime smoke-test script
        run: python -m py_compile scripts/test-ui-runtime.py
